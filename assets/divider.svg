<svg xmlns="http://www.w3.org/2000/svg" width="960" height="24" viewBox="0 0 960 24" role="img" aria-label="cybercore section divider">
<defs>
  <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/><stop offset=".35" stop-color="#00f0ff"/><stop offset=".65" stop-color="#ff2bd6"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-.5 0;.5 0;-.5 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="g" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect x="40" y="11" width="880" height="2" rx="1" fill="url(#l)" opacity=".8"/>
<circle r="5" cy="12" fill="#00f0ff" filter="url(#g)"><animate attributeName="cx" values="40;920;40" dur="6s" repeatCount="indefinite"/></circle>
<circle r="2.5" cy="12" fill="#ffffff"><animate attributeName="cx" values="40;920;40" dur="6s" repeatCount="indefinite"/></circle>
<circle r="3" cy="12" fill="#ff2bd6" filter="url(#g)"><animate attributeName="cx" values="920;40;920" dur="6s" repeatCount="indefinite"/></circle>
<rect x="450" y="8" width="60" height="8" rx="2" fill="#04040a" stroke="#8b5cf6" stroke-opacity=".5"/>
<text x="480" y="15" text-anchor="middle" font-family="'SFMono-Regular',Consolas,Menlo,'Liberation Mono',monospace" font-size="7" fill="#5b6b8c">SYS.OK</text></svg>